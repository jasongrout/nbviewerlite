name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build

      # the Chromium build that matches the installed @playwright/test
      - name: install Chromium
        run: npx playwright install --with-deps chromium

      # builds again (a few seconds) and serves the build with the preview server
      - name: end-to-end tests
        run: npm run test:e2e

      - name: upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
