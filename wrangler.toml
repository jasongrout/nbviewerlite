# Cloudflare Pages configuration (see "Deployment" in README.md).
#
# The project name must match this one. Pages serves dist/: files as
# themselves, missing /static/ files with static/404.html, and index.html
# (status 200) for every other path, because dist/ has no top-level 404.html.
name = "nbviewerlite"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
