# Cloudflare Pages. Set the build command to `npm run build` in the Pages
# project; it serves the `dist` directory. Pages serves index.html for paths
# with no file (its SPA mode) as long as dist/ has no top-level 404.html.
name = "nbviewerlite"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
